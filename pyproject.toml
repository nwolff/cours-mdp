[project]
name = "cours-mdp"
version = "0.1.0"
description = "Application pédagogique : stockage de mots de passe avec différentes stratégies (plaintext, rot13, md5, salted_md5)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-cloud-firestore>=2.27.0",
    "gunicorn>=26.0.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
